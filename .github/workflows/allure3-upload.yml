name: upload to allure testops using allure3

on:
  pull_request:
  workflow_dispatch:
    inputs:
      TESTS_TYPE:
        description: "Select type of tests"
        required: true
        type: choice
        options:
          - tests/poco/
          - tests/unit_many/
          - tests/unit_3k/
          - tests/unit/
          - tests/attachments/
          - tests/fixtures/
          - tests/
        default: tests/poco/
      TESTS_SUCCESS:
        description: "Select type of tests"
        required: true
        type: choice
        options:
          - always
          - random
          - never
          - broken
        default: always
      PYTEST_THREADS:
        description: "How many threads, sire?"
        required: true
        default: 1

jobs:
  all-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install tests dependencies
        run: |
          python -m pip install --upgrade pip
          pip install allure-pytest pytest pytest-xdist
      - name: install allure3
        run: |
          npm install -g allure
          npm init -y
          npm add -D allure
      - name: run pytest tests and upload to Allure TestOps
        run: | 
          npx allure run --config=./testops.mjs -- pytest ${{ inputs.TESTS_TYPE }} -n ${{ inputs.PYTEST_THREADS }} --alluredir=${ALLURE_RESULTS}
        env:
          ALLURE_ENDPOINT: ${{ secrets.ALLURE_ENDPOINT_TESTING }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN_TESTING }}
          ALLURE_PROJECT_ID: 276
          ALLURE_RESULTS: "allure-results"
          ALLURE_LAUNCH_NAME: "GitHub Actions upload using allure3"